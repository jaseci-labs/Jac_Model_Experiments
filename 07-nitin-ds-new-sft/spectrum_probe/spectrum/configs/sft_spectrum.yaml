# sft_fresh_probe/configs/sft.yaml VERBATIM except `adapter_path`.
# num_layers stays 16 -- the COUNT is unchanged; only membership changes, and
# spectrum_lora_layers.py cross-checks this value against the length of
# configs/spectrum_layers.json (spectrum-plan.md §6.1).
model: "models/qwen-q4"
train: true
data: "model-experiments/07-nitin-ds-new-sft/dataset/sft"
fine_tune_type: lora
num_layers: 16
lora_parameters:
  rank: 16
  scale: 2.0
  dropout: 0.05
batch_size: 1
iters: 8200
learning_rate: 2.0e-5
lr_schedule:
  name: cosine_decay
  warmup: 820
  arguments: [2.0e-5, 8200, 1.0e-6]
max_seq_length: 3072
adapter_path: "model-experiments/07-nitin-ds-new-sft/spectrum_probe/adapters/sft-on-nitin-spectrum"
save_every: 820
steps_per_eval: 500
steps_per_report: 50
val_batches: 8
seed: 42
mask_prompt: true
grad_checkpoint: true
