# sft_fresh_probe/spectrum/configs/sft_spectrum.yaml VERBATIM except `data`,
# `adapter_path`, and the added `resume_adapter_file` (seeds from the
# CPT-on-Spectrum adapter -- cpt-spectrum-plan.md §4.1). num_layers stays 16
# -- the COUNT is unchanged; only membership changes, and spectrum_lora_layers.py
# cross-checks this value against the length of configs/spectrum_layers.json.
model: "models/qwen-q4"
train: true
data: "model-experiments/04-cpt-sft/sft_cptspectrum_probe/dataset/sft"
fine_tune_type: lora
num_layers: 16
lora_parameters:
  rank: 16
  scale: 2.0
  dropout: 0.05
batch_size: 1
iters: 8200
learning_rate: 2.0e-5
lr_schedule:
  name: cosine_decay
  warmup: 820
  arguments: [2.0e-5, 8200, 1.0e-6]
max_seq_length: 3072
adapter_path: "model-experiments/04-cpt-sft/sft_cptspectrum_probe/adapters/sft-on-cptspectrum"
resume_adapter_file: "model-experiments/03-cpt-only/adapters/cpt-v2-spectrum-final/adapters.safetensors"
save_every: 820
steps_per_eval: 500
steps_per_report: 50
val_batches: 8
seed: 42
mask_prompt: true
grad_checkpoint: true
