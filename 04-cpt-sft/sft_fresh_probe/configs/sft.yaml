model: "models/qwen-q4"
train: true
data: "model-experiments/04-cpt-sft/sft_fresh_probe/dataset/sft"
fine_tune_type: lora
num_layers: 16
lora_parameters:
  rank: 16
  scale: 2.0
  dropout: 0.05
batch_size: 1
iters: 8200
learning_rate: 2.0e-5
lr_schedule:
  name: cosine_decay
  warmup: 820
  arguments: [2.0e-5, 8200, 1.0e-6]
max_seq_length: 3072
adapter_path: "model-experiments/04-cpt-sft/sft_fresh_probe/adapters/sft-on-fresh"
save_every: 820
steps_per_eval: 500
steps_per_report: 50
val_batches: 8
seed: 42
mask_prompt: true
grad_checkpoint: true
