# sft_stock.yaml VERBATIM except `adapter_path`. data/adapter_path below are the
# 08 defaults; 2-train/run_sft_spectrum.sh passes --data/--adapter-path from $EXP.
# num_layers stays 16 -- the COUNT is unchanged; only membership changes, and
# spectrum_lora_layers.jac cross-checks this value against the length of
# 2-train/spectrum/spectrum_layers.json (spectrum-plan.md §6.1).
model: "models/qwen-q4"
train: true
data: "experiments/08-nitin-new2-ds/dataset/sft"
fine_tune_type: lora
num_layers: 16
lora_parameters:
  rank: 16
  scale: 2.0
  dropout: 0.05
batch_size: 1
iters: 8200
learning_rate: 2.0e-5
lr_schedule:
  name: cosine_decay
  warmup: 820
  arguments: [2.0e-5, 8200, 1.0e-6]
max_seq_length: 3072
adapter_path: "experiments/08-nitin-new2-ds/adapter"
save_every: 820
steps_per_eval: 500
steps_per_report: 50
val_batches: 8
seed: 42
mask_prompt: true
grad_checkpoint: true
